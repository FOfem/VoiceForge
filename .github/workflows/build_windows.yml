name: Build VoiceForge Windows

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Upgrade pip and build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install --upgrade build
    
    - name: Install dependencies
      run: |
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements/prod.txt
        pip install sounddevice soundfile numpy scipy
        pip install TTS pyyaml requests
        pip install pyinstaller pytest pytest-cov
    
    - name: Verify package structure
      run: |
        echo "📁 Directory structure:"
        dir /s src
        echo ""
        echo "📄 Python files in src:"
        dir src\*.py
    
    - name: Install application in development mode
      run: |
        # ✅ FIX: Use non-editable install
        pip install .
        # Verify installation
        python -c "import src; print('✅ Application imported successfully')"
    
    - name: Run tests
      run: |
        pytest tests/ -v || echo "Tests skipped"
    
    - name: Build with PyInstaller
      run: |
        # Create spec file
        cat > voiceforge.spec << 'EOF'
        # -*- mode: python ; coding: utf-8 -*-
        
        block_cipher = None
        
        a = Analysis(
            ['src/main.py'],
            pathex=[],
            binaries=[],
            datas=[],
            hiddenimports=[
                'tkinter',
                'sounddevice',
                'soundfile',
                'torch',
                'torch.nn',
                'TTS',
                'numpy',
                'scipy',
                'pyyaml',
                'requests',
            ],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )
        
        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
        
        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='VoiceForge',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
            icon=None,
        )
        EOF
        
        pyinstaller voiceforge.spec --clean --noconfirm
    
    - name: Validate build
      run: |
        if (Test-Path "dist\VoiceForge.exe") {
          Write-Host "✅ Build successful!"
          Get-ChildItem dist\
        } else {
          Write-Host "❌ Build failed - no executable found"
          exit 1
        }
    
    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VoiceForge-Windows
        path: dist/
        if-no-files-found: error