name: Build VoiceForge Windows

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Configure UTF-8 encoding for Windows
      shell: cmd
      run: |
        chcp 65001
        echo "✅ UTF-8 encoding set"
    
    - name: Display directory structure
      shell: cmd
      run: |
        echo "Current directory:"
        cd
        echo ""
        echo "Repository contents:"
        dir /b
        echo ""
        echo "SRC directory contents:"
        if exist src\ (
          dir /s src
        ) else (
          echo "src directory not found!"
        )
    
    - name: Upgrade pip and build tools
      shell: cmd
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install --upgrade build
    
    - name: Install PyTorch (CPU version)
      shell: cmd
      run: |
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
    
    - name: Install dependencies
      shell: cmd
      run: |
        pip install sounddevice soundfile numpy scipy
        pip install TTS pyyaml requests
        pip install pyinstaller pytest pytest-cov
    
    - name: Install application
      shell: cmd
      run: |
        pip install .
        python -c "import src; print('Application imported successfully')"
    
    - name: Run tests (optional)
      shell: cmd
      run: |
        pytest tests/ -v || echo "Tests skipped"
    
    - name: Build with PyInstaller
      shell: cmd
      run: |
        pyinstaller --name="VoiceForge" --windowed --onefile --paths=src src/main.py
    
    - name: Validate build
      shell: cmd
      run: |
        if exist "dist\VoiceForge.exe" (
          echo Build successful!
          dir dist\
        ) else (
          echo Build failed - no executable found
          exit /b 1
        )
    
    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VoiceForge-Windows
        path: dist/
        if-no-files-found: error